<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ResearchPilot{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e4f'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='pilot.css') }}">
  <script src="{{ url_for('static', path='vendor/motion.js') }}"></script>
</head>
<body>
  <nav class="bar" aria-label="Main">
    <a class="name" href="/">ResearchPilot</a>
    <div class="tabs">
      <a href="/" class="{% block tab_research %}{% endblock %}">Research</a>
      <a href="/chat">Document chat</a>
    </div>
    <span class="env mono" id="env"></span>
  </nav>
  {% block body %}{% endblock %}
  <script>
    fetch('/health').then(r => r.json()).then(h => {
      const parts = [h.provider + ' · ' + h.model, 'fallback ' + h.fallback, 'search ' + h.search, h.tracing ? 'tracing on' : 'tracing off'];
      document.getElementById('env').innerHTML = '<span class="dot"></span>' + parts.join('  ·  ');
    }).catch(() => {});
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
